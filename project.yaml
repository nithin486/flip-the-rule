# Claude Code Game Studios config for Upside Down Run. See .claude/docs/effects-map.md for the schema.
schema_version: 1

framework:
  version: 1.3.0
  last_upgraded: 2026-11-27

engine:
  name: "Web"
  version: "Phaser 3.90"
  language: "TypeScript"
  code_root: "src"
  test_root: "tools"

platform:
  multiplayer: false
  online: false
  targets: [Web, Mobile]
  primary_input: "Keyboard/Mouse"
  gamepad_support: "None"
  touch_support: "Full"
  cert_tier: none

performance:
  target_framerate: 60
  frame_budget_ms: 16.67
  enforce: warn

commands:
  run: "npm run dev"
  build: "npm run build"
  test: "npm run verify"
