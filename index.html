<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="Upside Down Run - a gravity-flipping physics puzzle platformer. You can't jump. Flip gravity instead." />
<title>Upside Down Run</title>
<script>
/* CrazyGames SDK v3 in <head>, before the game code (as their docs require) - only when actually running on CrazyGames (host, parent frame or ?platform=crazygames),
   so the game keeps working untouched on other hosts. */
(function(){try{var a=[location.hostname,document.referrer,location.search];if(location.ancestorOrigins){for(var i=0;i<location.ancestorOrigins.length;i++)a.push(location.ancestorOrigins[i]);}
if(/crazygames\.|platform=crazygames/i.test(a.join(' '))){var s=document.createElement('script');s.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';s.async=true;s.id='cg-sdk';document.head.appendChild(s);}}catch(e){}})();
</script>
<style>
  html,body{margin:0;height:100%;background:#0B0B1A;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #game{position:fixed;inset:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
  canvas{display:block;outline:none}
  #rotate{display:none;position:fixed;inset:0;z-index:9;background:#0B0B1A;color:#fff;font-family:'Baloo 2','Trebuchet MS',sans-serif;font-size:22px;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:10px}
  @media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="game"></div>
<div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0b1a;color:#fff;font:800 clamp(26px,6vw,48px) system-ui,sans-serif;letter-spacing:.04em;z-index:5"><div>UPSIDE DOWN RUN</div><div style="width:min(260px,60vw);height:6px;border-radius:3px;background:#1e1b4b;overflow:hidden"><div style="width:40%;height:100%;background:#a78bfa;border-radius:3px;animation:bs 1s ease-in-out infinite alternate"></div></div><style>@keyframes bs{from{transform:translateX(-30%)}to{transform:translateX(160%)}}</style></div>
<div id="rotate"><div style="font-size:54px">&#x21BB;</div><div>Rotate your device<br/>to landscape to play</div></div>
<script type="module" src="/src/main.ts"></script>
<!-- Cloudflare Web Analytics: only on the direct site, never inside the CrazyGames iframe -->
<script>
(function(){try{
if(window.top!==window.self)return;
if(/crazygames/i.test(document.referrer||''))return;
window.addEventListener('load',function(){setTimeout(function(){
var s=document.createElement('script');s.type='module';
s.src='https://static.cloudflareinsights.com/beacon.min.js';
s.setAttribute('data-cf-beacon','{"token": "e2abcc73b335408f8eb868bc977d0ca9"}');
document.body.appendChild(s);},2000);});
}catch(e){}})();
</script>
</body>
</html>
