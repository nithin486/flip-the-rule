<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="FLIP THE RULE - a gravity-flipping physics puzzle platformer. You can't jump. Flip gravity instead." />
<title>Flip The Rule</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Poppins:wght@500;600&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;height:100%;background:#0B0B1A;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #game{position:fixed;inset:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
  canvas{display:block;outline:none}
  #rotate{display:none;position:fixed;inset:0;z-index:9;background:#0B0B1A;color:#fff;font-family:'Baloo 2','Trebuchet MS',sans-serif;font-size:22px;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:10px}
  @media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate"><div style="font-size:54px">&#x21BB;</div><div>Rotate your device<br/>to landscape to play</div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
